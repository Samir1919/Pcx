name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pcx_test
          POSTGRES_USER: pcx
          POSTGRES_PASSWORD: pcx_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcx -d pcx_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://pcx:pcx_ci_only@localhost:5432/pcx_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify:ci
