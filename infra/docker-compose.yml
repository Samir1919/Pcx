services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pcx
      POSTGRES_USER: pcx
      POSTGRES_PASSWORD: pcx_local_only
    ports: [ "5432:5432" ]
    volumes: [ "pcx-postgres:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pcx -d pcx" ]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes: [ "pcx-redis:/data" ]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pcx_local
      MINIO_ROOT_PASSWORD: change_me_local_only
    ports: [ "9000:9000", "9001:9001" ]
    volumes: [ "pcx-minio:/data" ]

  # Real ClamAV daemon for the E19 malware gate. Opt-in: set CLAMAV_ENDPOINT on
  # the api service (below) to clamav:3310 to route uploads through clamd; the
  # API otherwise uses the bundled fail-closed signature scanner.
  clamav:
    image: clamav/clamav:stable
    ports: [ "3310:3310" ]
    volumes: [ "pcx-clamav:/var/lib/clamav" ]
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: [ "node", "apps/api/src/infrastructure/database/migrate.mjs" ]
    environment:
      DATABASE_URL: postgresql://pcx:pcx_local_only@postgres:5432/pcx
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://pcx:pcx_local_only@postgres:5432/pcx
      API_PORT: 4000
      NODE_ENV: development
      API_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      API_ADMIN_ORIGINS: http://localhost:3001,http://127.0.0.1:3001
      # Media object storage (MinIO, S3-compatible). true = MinIO, false = local disk.
      OBJECT_STORAGE_ENABLED: "false"
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: pcx-local
      OBJECT_STORAGE_ACCESS_KEY: pcx_local
      OBJECT_STORAGE_SECRET_KEY: change_me_local_only
      # Real ClamAV malware gate (opt-in). Empty = bundled fail-closed signature
      # scanner. Set to clamav:3310 to stream uploads through the clamd daemon.
      CLAMAV_ENDPOINT: ""
      CLAMAV_TIMEOUT_MS: "5000"
    ports: [ "4000:4000" ]
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages/domain:/app/packages/domain
      - ../package.json:/app/package.json
      - ../package-lock.json:/app/package-lock.json
    command: [ "node", "--watch", "apps/api/src/index.mjs" ]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://pcx:pcx_local_only@postgres:5432/pcx
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: node:24.19.0-alpine
    working_dir: /app
    environment:
      PCX_API_ORIGIN: http://api:4000
      NODE_ENV: development
      # Next dev server blocks cross-origin (LAN/other-device) asset requests
      # unless the sender origin is allow-listed. `*` keeps the local stack
      # reachable over a dynamic WiFi IP without hardcoding it (dev only).
      PCX_DEV_ALLOWED_ORIGINS: "*"
    ports: [ "3000:3000" ]
    volumes:
      - ..:/app
      - web_node_modules:/app/node_modules
    command: [ "sh", "-c", "npm ci --workspace @pcx/web --no-audit --no-fund && npm run dev -w @pcx/web -- -p 3000" ]
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  admin:
    image: node:24.19.0-alpine
    working_dir: /app
    environment:
      PCX_API_ORIGIN: http://api:4000
      NODE_ENV: development
      # Next dev server blocks cross-origin (LAN/other-device) asset requests
      # unless the sender origin is allow-listed. `*` keeps the local stack
      # reachable over a dynamic WiFi IP without hardcoding it (dev only).
      PCX_DEV_ALLOWED_ORIGINS: "*"
    ports: [ "3001:3001" ]
    volumes:
      - ..:/app
      - admin_node_modules:/app/node_modules
    command: [ "sh", "-c", "npm ci --workspace @pcx/admin --no-audit --no-fund && npm run dev -w @pcx/admin -- -p 3001" ]
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pcx-postgres:
  pcx-redis:
  pcx-minio:
  pcx-clamav:
  web_node_modules:
  admin_node_modules:
